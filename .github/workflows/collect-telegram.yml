name: Collect Telegram snapshot

on:
  schedule:
    # Avoid the top of the hour, when GitHub Actions schedules are busiest.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      trigger:
        description: "Who started this run (recorded in data/health/telegram.json)"
        required: false
        default: manual

permissions:
  contents: write

concurrency:
  group: collect-telegram-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout collector code
        uses: actions/checkout@v4
        with:
          path: code
          persist-credentials: false

      - name: Checkout public snapshot branch
        uses: actions/checkout@v4
        with:
          ref: snapshot-data
          path: state
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Telegram client
        run: python -m pip install --disable-pip-version-check telethon==1.44.0

      - name: Ensure pdftotext is available
        run: command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)

      - name: Collect snapshot
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          SNAPSHOT_MAX_ITEMS: "500"
          BACKFILL_PER_CHANNEL: "100"
          # Optional: without these three secrets media upload is skipped and
          # the text feed is produced exactly as before.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          # Per-run ceilings for Drive uploads and link expansion.
          MEDIA_MAX_FILES_PER_RUN: "20"
          MEDIA_MAX_MB_PER_RUN: "150"
          MEDIA_MAX_SECONDS_PER_RUN: "240"
          LINK_MAX_LOOKUPS_PER_RUN: "40"
          LINK_MAX_SECONDS_PER_RUN: "60"
          COLLECT_TRIGGER: ${{ github.event_name == 'workflow_dispatch' && inputs.trigger || github.event_name }}
        run: |
          python code/telegram_snapshot.py state/latest_snapshot.json
          python code/build_feed_windows.py state/latest_snapshot.json state/data/telegram

      - name: Publish snapshot branch
        # Also runs after a failed collection so the error lands in the health file.
        if: always()
        working-directory: state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Public files only: feeds, media index (ids/hashes, no file bodies),
          # link cache and health. Drive files never touch this repository.
          for path in latest_snapshot.json data/telegram data/health/telegram.json; do
            [ -e "$path" ] && git add -- "$path"
          done
          # One-time cleanup of the retired TickerTick news output.
          git rm -r -q --ignore-unmatch -- data/news data/health/tickertick.json
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "chore: update Telegram snapshots"
          for attempt in 1 2 3; do
            git fetch origin snapshot-data
            git rebase origin/snapshot-data || {
              git rebase --abort
              exit 1
            }
            if git push origin HEAD:snapshot-data; then
              exit 0
            fi
            sleep 3
          done
          exit 1
