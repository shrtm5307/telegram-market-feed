name: Collect Telegram snapshot

on:
  schedule:
    # Avoid the top of the hour, when GitHub Actions schedules are busiest.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-telegram-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout collector code
        uses: actions/checkout@v4
        with:
          path: code
          persist-credentials: false

      - name: Checkout public snapshot branch
        uses: actions/checkout@v4
        with:
          ref: snapshot-data
          path: state
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Telegram client
        run: python -m pip install --disable-pip-version-check telethon==1.44.0

      - name: Collect snapshot
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          SNAPSHOT_MAX_ITEMS: "500"
          BACKFILL_PER_CHANNEL: "100"
        run: |
          python code/telegram_snapshot.py state/latest_snapshot.json
          python code/build_feed_windows.py state/latest_snapshot.json state/data/telegram

      - name: Publish snapshot branch
        working-directory: state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_snapshot.json data/telegram/latest_6h.json data/telegram/latest_24h.json
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "chore: update Telegram snapshots"
          for attempt in 1 2 3; do
            git fetch origin snapshot-data
            git rebase origin/snapshot-data || {
              git rebase --abort
              exit 1
            }
            if git push origin HEAD:snapshot-data; then
              exit 0
            fi
            sleep 3
          done
          exit 1
